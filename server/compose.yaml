services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omen
      POSTGRES_USER: omen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - omen-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omen -d omen"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  omen-postgres:
