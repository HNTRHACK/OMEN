name: Backend B1
on:
  pull_request:
    paths: ["server/**", "test/**", "shared/**", "package*.json", ".github/workflows/backend-b1.yml"]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omen_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: omen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omen_test -d omen_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://omen_test:local_ci_only@127.0.0.1:5432/omen_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm --prefix server test
      - run: npm test
